const features=dataset.features.filter(f=>f.geometry&&f.properties&&f.properties.answer);
const $=id=>document.getElementById(id);const genres=[...new Set(features.map(f=>f.properties.genre||'その他'))];const label={市町村名:'市',町名:'町',道路名:'道路',施設名:'施設',駅:'駅','交差点・信号機':'交差点'};
for(const g of genres){const o=document.createElement('option');o.value=g;o.textContent=(label[g]||g)+'（'+features.filter(f=>f.properties.genre===g).length+'問）';$('genre').appendChild(o)}
let map,overlay,questions=[],index=0,correct=0,seconds=20,interval=null,answered=false;
function pool(){return features.filter(f=>$('genre').value==='ALL'||f.properties.genre===$('genre').value)}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function show(id){for(const key of ['setup','game','result'])$(key).classList.toggle('hidden',key!==id)}
function initMap(){
 if(map)return;
 map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([35.70,139.42],11);
 // OpenFreeMap vector style: hide every symbol layer (text AND icons), retain all physical features.
 // This deliberately hides icons too: some POI names are baked into symbol layouts.
 const status=document.getElementById('mapStatus');
 if(!L.maplibreGL){showFallback('地図ライブラリを読み込めませんでした');return;}
 fetch('https://tiles.openfreemap.org/styles/liberty')
  .then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()})
  .then(style=>{
    if(!Array.isArray(style.layers))throw Error('地図スタイルが不正です');
    for(const layer of style.layers){
      if(layer.type==='symbol')layer.layout={...(layer.layout||{}),visibility:'none'};
    }
    // Prioritize railways and quiet down dense streets and building outlines.
    const railLayers=[];
    const stationLayers=[];
    for(const layer of style.layers){
      const id=String(layer.id||'').toLowerCase();
      const sourceLayer=String(layer['source-layer']||'').toLowerCase();
      const tag=id+' '+sourceLayer;
      // Show station icons without text. Exclude other POIs to prevent answer leakage.
      if(layer.type==='symbol' && /station|railway-station|transit-stop/.test(id) && !/label-only|name-only/.test(id)){
        const hasIcon=layer.layout && layer.layout['icon-image'];
        if(hasIcon){
          layer.layout={...layer.layout,visibility:'visible','text-field':'','text-optional':true,'icon-optional':false};
          layer.paint={...(layer.paint||{}),'text-opacity':0};
          stationLayers.push(layer);
        }
      }
      if(layer.type==='fill' && /building/.test(tag)){
        layer.paint={...(layer.paint||{}),'fill-color':'#e8e9e8','fill-opacity':0.35,'fill-outline-color':'#e1e3e2'};
      }
      if(layer.type==='line' && /building/.test(tag)){
        layer.paint={...(layer.paint||{}),'line-color':'#e0e2e1','line-opacity':0.25,'line-width':0.35};
      }
      if(layer.type==='line'){
        if(/rail|railway|subway|tram|transit/.test(id)){
          layer.paint={...(layer.paint||{}),'line-color':'#48515e','line-opacity':0.95,
            'line-width':['interpolate',['linear'],['zoom'],7,0.9,9,1.2,11,1.5,13,1.8,16,1.7,18,1.5],
            'line-dasharray':['literal',[1,0]]};
          railLayers.push(layer);
        }else if(/road|street|highway|motorway|trunk|primary|secondary|tertiary|transportation|bridge|tunnel|path/.test(tag)){
          const casing=/casing|outline|border/.test(id);
          const major=/motorway|trunk|highway|primary|major/.test(id);
          const minor=/minor|residential|service|path|track|footway|pedestrian/.test(id);
          layer.paint={...(layer.paint||{}),
            'line-color':['match',['get','class'],['motorway','motorway_link'],casing?'#f5cf9f':'#e7a05a',casing?'#d4d9dc':major?'#aab5bf':minor?'#d5d9dd':'#c3cbd1'],
            'line-opacity':['match',['get','class'],['motorway','motorway_link'],0.95,major?0.85:minor?0.45:0.66],
            'line-width':['interpolate',['linear'],['zoom'],9,major?1.2:0.35,12,major?2.4:0.8,15,major?4.5:minor?1.0:1.9,18,major?7:minor?2:3.5]};
        }
      }
    }
    // Additional dedicated monorail rendering from the existing OpenMapTiles transportation source.
    // This can reveal monorail track at zoom levels where the default rail style suppresses it.
    const transportationTemplate=style.layers.find(l=>l.type==='line' && l['source-layer']==='transportation' && l.source);
    const monorailLayers=[];
    if(transportationTemplate){
      const source=transportationTemplate.source;
      const sourceLayer=transportationTemplate['source-layer'];
      const filter=['any',
        ['==',['get','subclass'],'monorail'],
        ['==',['get','class'],'monorail']
      ];
      monorailLayers.push({id:'quiz-monorail-outline',type:'line',source,'source-layer':sourceLayer,minzoom:8,
        filter,layout:{'line-cap':'round','line-join':'round'},
        paint:{'line-color':'#ffffff','line-opacity':0.95,'line-width':['interpolate',['linear'],['zoom'],8,2.4,11,3.6,14,4.4,17,5.5]}});
      monorailLayers.push({id:'quiz-monorail-main',type:'line',source,'source-layer':sourceLayer,minzoom:8,
        filter,layout:{'line-cap':'round','line-join':'round'},
        paint:{'line-color':'#3a4654','line-opacity':0.95,'line-width':['interpolate',['linear'],['zoom'],8,1.4,11,2.2,14,2.7,17,3.3]}});
    }
    // Station symbols drawn from vector tile POIs; text is never enabled.
    // Use compact high-contrast station dots to distinguish stations from rail yards.
    const stationDots=[];
    const source=transportationTemplate?.source;
    if(source){
      const stationFilter=['any',
        ['==',['get','class'],'railway'],
        ['==',['get','class'],'railway_station'],
        ['==',['get','class'],'station'],
        ['==',['get','subclass'],'station'],
        ['==',['get','subclass'],'halt'],
        ['==',['get','subclass'],'subway'],
        ['==',['get','subclass'],'railway_station']
      ];
      stationDots.push({id:'quiz-station-halo',type:'circle',source,'source-layer':'poi',minzoom:10,filter:stationFilter,
        paint:{'circle-radius':['interpolate',['linear'],['zoom'],10,2.8,12,3.8,15,5.2,18,6.5],
          'circle-color':'#ffffff','circle-opacity':0.95,'circle-stroke-color':'#ffffff','circle-stroke-width':1}});
      stationDots.push({id:'quiz-station-dot',type:'circle',source,'source-layer':'poi',minzoom:10,filter:stationFilter,
        paint:{'circle-radius':['interpolate',['linear'],['zoom'],10,1.8,12,2.7,15,3.8,18,4.8],
          'circle-color':'#283e54','circle-opacity':0.95}});
    }
    // Render railway lines over streets so crossings and station approaches remain recognizable.
    style.layers=style.layers.filter(l=>!railLayers.includes(l)&&!stationLayers.includes(l)).concat(railLayers,monorailLayers,stationLayers,stationDots);
    L.maplibreGL({style,attribution:'© OpenFreeMap © OpenStreetMap contributors'}).addTo(map);
    if(status)status.textContent='';
  })
  .catch(e=>showFallback('文字なし地図の読み込みに失敗：'+e.message));
}
function showFallback(reason){
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(map);
 const status=document.getElementById('mapStatus');
 if(status){status.textContent=reason+'。一時的に従来の文字あり地図を表示中（答えが見える場合があります）';status.style.color='#b43c19'}
}
const fallbackByGenre={市町村名:['立川市','国立市','国分寺市','府中市','小平市','東村山市','清瀬市','東久留米市','武蔵村山市','昭島市','福生市','瑞穂町','日の出町'],町名:['錦町','柴崎町','高松町','栄町','富士見町','若葉町','羽東','五ノ神','本町','緑町','砂川町','西砂町'],道路名:['新奥多摩街道','五日市街道','青梅街道','府中街道','立川通り','芋窪街道','新青梅街道'],施設名:['国営昭和記念公園','立川市役所','国立市役所','多摩動物公園','昭島市役所','小平市役所'],駅:['立川駅','国立駅','拝島駅','昭島駅','玉川上水駅','西国立駅'], '交差点・信号機':['立川駅北口交差点','日野橋交差点','砂川七番交差点','曙町二丁目交差点','高松町三丁目交差点']};
function displayAnswer(name,genre){return genre==='交差点・信号機'?String(name).replace(/交差点$/u,''):String(name)}
function optionsFor(f){const g=f.properties.genre,answer=f.properties.answer;const candidates=shuffle([...features.filter(x=>x!==f&&x.properties.genre===g).map(x=>x.properties.answer),...(fallbackByGenre[g]||[])]);const seen=new Set([displayAnswer(answer,g)]);const choices=[answer];for(const candidate of candidates){const shown=displayAnswer(candidate,g);if(!shown||seen.has(shown))continue;seen.add(shown);choices.push(candidate);if(choices.length===4)break}return shuffle(choices)}
function draw(f){if(overlay){overlay.remove();overlay=null}const geom=f.geometry;const shape=geom.type;let style={color:'#2438d8',weight:4,opacity:1,fillColor:'#465dff',fillOpacity:.25};try{if(shape==='Point'){const [lng,lat]=geom.coordinates;overlay=L.circleMarker([lat,lng],{radius:12,color:'#fff',weight:4,fillColor:'#2438d8',fillOpacity:1}).addTo(map);map.setView([lat,lng],15,{animate:false})}else{overlay=L.layerGroup().addTo(map);if(shape.includes('Line')){L.geoJSON(f,{style:{color:'#ffffff',weight:8,opacity:.95,lineCap:'round',lineJoin:'round'},interactive:false}).addTo(overlay)}const foreground=L.geoJSON(f,{style: function(feature){const t=feature.geometry.type;return {...style, ...(t.includes('Line')?{color:'#2438d8',weight:4,opacity:1,dashArray:null}:{})};}}).addTo(overlay);const bounds=foreground.getBounds();if(bounds.isValid())map.fitBounds(bounds.pad(.22),{animate:false,maxZoom:shape.includes('Line')?14:13,padding:[20,20]})}}catch(e){console.error(e)}}
function startTimer(){clearInterval(interval);seconds=20;$('timer').textContent='残り20秒';$('bar').style.width='100%';interval=setInterval(()=>{seconds--;$('timer').textContent='残り'+seconds+'秒';$('bar').style.width=(seconds/20*100)+'%';if(seconds<=0){clearInterval(interval);finishAnswer(null)}},1000)}
function render(){answered=false;const f=questions[index];$('progress').textContent='第'+(index+1)+'問 / '+questions.length+'問　正解 '+correct;$('glabel').textContent='ジャンル：'+(label[f.properties.genre]||f.properties.genre);$('prompt').textContent=f.properties.genre==='道路名'?'青い線で示された道路の名前は？':f.properties.genre==='交差点・信号機'?'青い印が示す交差点の名前は？':f.geometry.type==='Point'?'青い印が示す場所・名称は？':'色付きの範囲はどこ？';$('feedback').innerHTML='';$('next').classList.add('hidden');$('options').replaceChildren();for(const ans of optionsFor(f)){const b=document.createElement('button');b.className='option';b.textContent=displayAnswer(ans,f.properties.genre);b.dataset.rawAnswer=ans;b.onclick=()=>finishAnswer(ans);$('options').appendChild(b)}draw(f);startTimer()}
function finishAnswer(chosen){if(answered)return;answered=true;clearInterval(interval);const f=questions[index];const ans=f.properties.answer;const ok=chosen===ans;if(ok)correct++;for(const b of $('options').children){b.disabled=true;if(b.dataset.rawAnswer===ans)b.classList.add('correct');else if(b.dataset.rawAnswer===chosen)b.classList.add('wrong')}$('feedback').textContent=ok?'⭕ 正解！':chosen===null?'⌛ 時間切れ！　正解：'+displayAnswer(ans,f.properties.genre):'❌ 不正解　正解：'+displayAnswer(ans,f.properties.genre);if(f.properties.explanation){const d=document.createElement('small');d.textContent=f.properties.explanation;$('feedback').appendChild(d)}$('next').textContent=index+1===questions.length?'結果を見る':'次の問題へ';$('next').classList.remove('hidden')}
$('start').onclick=()=>{questions=shuffle(pool()).slice(0,3);index=0;correct=0;show('game');initMap();setTimeout(()=>{map.invalidateSize();render()},80)};
$('next').onclick=()=>{if(++index<questions.length)render();else{clearInterval(interval);show('result');$('score').textContent=correct+' / '+questions.length+' 問';$('stats').textContent='正解率 '+Math.round(correct/questions.length*100)+'%'}};
$('again').onclick=()=>{$('start').click()};$('home').onclick=()=>{clearInterval(interval);show('setup')};
