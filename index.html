<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北多摩地理クイズ｜地図編集（試作）</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Meiryo',sans-serif;background:#f4f6f8;color:#17212b}header{background:#163a58;color:white;padding:14px 18px}header h1{font-size:20px;margin:0}header small{opacity:.8}main{display:grid;grid-template-columns:310px 1fr;min-height:calc(100vh - 72px)}aside{padding:16px;background:white;box-shadow:1px 0 5px #ddd;z-index:500}label{display:block;font-weight:700;margin:12px 0 5px}input,select,button{font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid #b8c4cd}button{cursor:pointer;background:#e9f1f8;margin-top:8px}button.primary{background:#176aa3;color:white;border:0}button:disabled{opacity:.45;cursor:default}#map{height:calc(100vh - 72px);min-height:450px}p{font-size:13px;line-height:1.6}#status{background:#f0f5fa;padding:10px;border-radius:8px;min-height:44px}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tools button{padding:9px 3px;font-size:13px}.active{background:#176aa3!important;color:white!important}#list{max-height:150px;overflow:auto;font-size:12px}#list div{padding:5px;border-bottom:1px solid #eee}@media(max-width:700px){main{display:flex;flex-direction:column}aside{box-shadow:none}#map{height:55vh;min-height:360px}}</style></head><body><header><h1>🗺️ 北多摩17市 地図編集</h1><small>試作品｜ピン・道路・範囲を指定して保存（地図名表示は暫定）</small></header><main><aside><label for="qid">問題ID（仮の番号でもOK）</label><input id="qid" placeholder="例：SPOT-0001"><label for="answer">正解の名称</label><input id="answer" placeholder="例：昭和記念公園"><label>地図への指定方法</label><div class="tools"><button id="pin" class="active" onclick="modeSet('pin')">📍 ピン</button><button id="line" onclick="modeSet('line')">🛣️ 道路</button><button id="area" onclick="modeSet('area')">▧ 範囲</button></div><p id="status">地図をクリックしてピンを置いてください。</p><button onclick="finish()" id="finish" disabled>線・範囲を確定</button><button onclick="undo()">最後の点を取り消す</button><button class="primary" onclick="save()">この問題を登録</button><label>登録済みの地図データ</label><div id="list">まだありません</div><button onclick="download()">地図データをダウンロード（JSON）</button><button onclick="document.getElementById('upload').click()">保存したJSONを読み込む</button><input type="file" id="upload" accept=".json,application/json" hidden onchange="loadFile(event)"><p>※ データはこの画面を閉じると消えます。必ずJSONをダウンロードしてください。スプレッドシートとの自動連携は今後実装します。<br>※ 地図の境界線は現段階では手動指定です。<br>※ この暫定版では地図上に地名・道路名が表示されます。クイズ本番用の名称非表示地図は別途対応予定です。</p></aside><div id="map" aria-label="地図"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([35.71,139.45],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
let mode='pin',pts=[],temp=null,records=[],layers=[];const $=id=>document.getElementById(id);const messages={pin:'地図をクリックしてピンを置いてください。',line:'道路に沿って2点以上クリックし「線・範囲を確定」を押してください。',area:'境界に沿って3点以上クリックし「線・範囲を確定」を押してください。'};
function modeSet(m){mode=m;pts=[];if(temp)map.removeLayer(temp);temp=null;for(const x of ['pin','line','area'])$(x).classList.toggle('active',x===m);$('status').textContent=messages[m];$('finish').disabled=m==='pin';}
function draw(){if(temp)map.removeLayer(temp);temp=null;if(!pts.length)return;if(mode==='pin')temp=L.marker(pts[0]).addTo(map);else if(mode==='line')temp=L.polyline(pts,{color:'#e57d13',weight:6}).addTo(map);else temp=L.polygon(pts,{color:'#2677d2',fillOpacity:.25}).addTo(map);}
map.on('click',e=>{if(mode==='pin')pts=[e.latlng];else pts.push(e.latlng);draw();$('status').textContent=mode==='pin'?'ピンを配置しました。問題を登録できます。':pts.length+'点を指定しました。';});
function undo(){pts.pop();draw();$('status').textContent=messages[mode];}
function finish(){if(pts.length<(mode==='line'?2:3)){alert('指定した点が足りません');return;}$('status').textContent='指定できました。「この問題を登録」を押してください。';}
function geometry(){const coords=pts.map(p=>[p.lng,p.lat]);if(mode==='pin')return {type:'Point',coordinates:coords[0]};if(mode==='line')return {type:'LineString',coordinates:coords};return {type:'Polygon',coordinates:[[...coords,coords[0]]]};}
function save(){const id=$('qid').value.trim(),answer=$('answer').value.trim();if(!id||!answer){alert('問題IDと正解の名称を入力してください');return;}if(pts.length<(mode==='pin'?1:mode==='line'?2:3)){alert('地図上で必要な点を指定してください');return;}if(records.some(r=>r.properties.questionId===id)){alert('この問題IDは登録済みです。別のIDにしてください');return;}const f={type:'Feature',properties:{questionId:id,answer,shape:mode},geometry:geometry()};records.push(f);const layer=L.geoJSON(f,{style:{color:mode==='line'?'#e57d13':'#2677d2',weight:5},pointToLayer:(_,latlng)=>L.marker(latlng)}).addTo(map);layer.bindPopup(id+'：'+answer);layers.push(layer);$('list').innerHTML=records.map(r=>'<div>'+escapeHTML(r.properties.questionId)+'｜'+escapeHTML(r.properties.answer)+'</div>').join('');$('qid').value='';$('answer').value='';pts=[];if(temp)map.removeLayer(temp);temp=null;$('status').textContent='登録しました。忘れずにJSONをダウンロードしてください。';}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function download(){if(!records.length){alert('まだ登録データがありません');return;}const b=new Blob([JSON.stringify({type:'FeatureCollection',features:records},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kitatama-map-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
async function loadFile(e){const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.type!=='FeatureCollection'||!Array.isArray(data.features))throw Error('形式が違います');for(const layer of layers)map.removeLayer(layer);layers=[];records=[];for(const f of data.features){if(!f.properties?.questionId||!f.geometry)continue;records.push(f);const layer=L.geoJSON(f,{style:{color:'#2677d2',weight:5}}).addTo(map);layer.bindPopup(String(f.properties.questionId)+'：'+String(f.properties.answer||''));layers.push(layer);}$('list').innerHTML=records.map(r=>'<div>'+escapeHTML(String(r.properties.questionId))+'｜'+escapeHTML(String(r.properties.answer||''))+'</div>').join('')||'まだありません';$('status').textContent=records.length+'件読み込みました。';}catch(err){alert('読み込み失敗：'+err.message);}e.target.value='';}
</script></body></html>
